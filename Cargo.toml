# fandhe-auth の workspace ルート（virtual workspace）。
# TASK-3 (1/6): 段階 1 の crate（core・secret・db-tests・client・plugin-oidc）を並べる（LIB-14・LIB-15、
# D-2026-10-27-8）。ほかに試験専用の stub 2 つ（hub-stub・console-stub）と、暫定の置き場の backend を
# メンバーに含める（下の注記）。メンバーは glob にせず明示列挙する。段階 2 のうち webauthn-wasm・frontend 等、
# Hub が担当する crate（db-pg・db-fandhe・db-migrate・server）は含めない。
# TASK-9 (2/8): crates/backend は TASK-9 の暫定の置き場（D-2026-11-20-1）。spec 上は段階 2（LIB-14）。
# interim に最初の中身を足す前、または fandhe-backend への依存を足す前の早い方で、LIB-15 の判定を記録する
# （D-2026-11-20-3）。判定の記録は docs/interim/README.md の「backend の切り出しの記録」の判定の欄
# （判定 (1)〜(4)）にあり、人が記入する。この注記は判定の根拠ではない。
# 最初のリリースから除く仕組みは未決（Q-2026-11-20-1）。
# TASK-3 (4/6): 同梱 Plugin（外部ログイン Plugin の OIDC 共通部品）は段階 1 のメンバーとして
# crates/plugin-oidc に置く。本体には含めない（LIB-14・PLG-26）。名前 fandhe-auth-plugin-oidc は
# D-2026-11-20-2 で決まった。crates.io の空きは未照会で、公開するかは別に決める（同決定）。
# TASK-7 (1/12): crates/hub-stub は Hub の検証用 stub で、試験専用。段階 1 のリリースのメンバーではない
# （LIB-14・LIB-15）。本体・Plugin からは依存しない。試験専用の it-harness と、試験（dev）だけの load-harness が依存する
# （TASK-10 (3/6)・TASK-12 (5/10)。許可表の行は人の確認待ち）。名前・置き場は仮称で、人が確定する。
# TASK-8 (1/8): crates/console-stub は console の検証用 stub で、試験専用。段階 1 のリリースのメンバーではない
# （LIB-14・LIB-15）。本体・Plugin からは依存しない。試験専用の it-harness だけが依存する
# （TASK-10 (4/6)。許可表の行は人の確認待ち）。名前・置き場は仮称で、人が確定する。
# TASK-10 (1/6): crates/it-harness は結合試験のハーネスの枠で、試験専用。段階 1 のリリースのメンバーではない
# （LIB-14・LIB-15）。本体・Plugin からは依存しない。試験専用の load-harness だけが試験（dev）で依存する
# （TASK-12 (5/10)。許可表の行は人の確認待ち）。名前・置き場は仮称で、人が確定する。
# TASK-11 (1/6): crates/e2e-harness は passkey の E2E ハーネスの枠で、試験専用。段階 1 のリリースのメンバーではない
# （LIB-14・LIB-15）。どの crate からも依存しない。依存は 0。名前・置き場は仮称で、人が確定する。
# TASK-12 (3/10): crates/load-harness は計測・負荷のハーネスの計測の部品で、試験専用。段階 1 のリリースのメンバー
# ではない（LIB-14・LIB-15）。どの crate からも依存しない。通常の依存は 0（std だけ）。試験（dev）だけ it-harness・hub-stub に依存する
# （TASK-12 (5/10)。許可表の行は人の確認待ち）。名前・置き場は仮称で、人が確定する。
# TASK-4 (6/6)・#35: crates/trial-deps は依存の試し実装の試験専用 crate。段階 1 のリリースのメンバーではない
# （LIB-14）。名前・置き場は仮称で、人が確定する。採った道具と試験の形を本番の TASK（500・511・513・514・518・116・117）が引き取ったら消す
# （513: 派生 Debug の入れ物の試験と乱数の probe、500: 陽性対照、511: SECR-11 の property test と fuzz）。
# TASK-667 (3/4): DPOL-14 の試験を dev 依存（jsonwebtoken・aws-lc-rs・pem）で置く。本番の採否の決定ではない。
# crates/trial-deps/fuzz は別 workspace（nightly）で、ここには含めない（exclude）。
[workspace]
resolver = "3" # 暫定。人が確定する。
members = [
  "crates/core",
  "crates/secret",
  "crates/db-tests",
  "crates/client",
  "crates/plugin-oidc",
  "crates/hub-stub",
  "crates/console-stub",
  "crates/it-harness",
  "crates/e2e-harness",
  "crates/load-harness",
  "crates/backend",
  "crates/trial-deps",
]
exclude = ["crates/trial-deps/fuzz"]

[workspace.package]
version = "0.0.0"
# MSRV は 1.100、edition は 2024（利用者の決定 D-2026-11-20-12）。MSRV の値は CI も読む
# （scripts/msrv.sh。.github/workflows/ci.yml の build-test・lint・it-db-ci が scripts/install-msrv.sh 経由で入れる）ので、変えるときはここだけを直す。
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0" # DPOL-26
repository = "https://github.com/Fandhe-AI/fandhe-auth"
# crates.io へ公開するかは別に決める（D-2026-10-27-8）。決まるまで誤公開を防ぐ。
publish = false

# lint の設定（TASK-3 (5/6)）。各 crate が [lints] workspace = true で取り込む。
# unsafe_code の forbid は利用者の決定（2026-11-13）。各 crate の lib.rs の
# #![forbid(unsafe_code)] と二重に守る。それ以外の lint の値は人が決める。暫定。
[workspace.lints.rust]
unsafe_code = "forbid"

# 依存クレート（workspace メンバー以外）のデバッグ情報を行番号のみにする。
# panic 位置・バックトレース・プロファイラの行番号は残り、失うのはデバッガで依存の
# 変数・型を見る機能だけ。自分たちのクレートは full debuginfo のまま。
[profile.dev.package."*"]
debug = "line-tables-only"
