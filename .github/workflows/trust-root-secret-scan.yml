# 組織の ruleset が必須にする秘密情報の検査（issue #5985。D-2026-11-21-19・D-2026-11-21-23。置き場所を fandhe-auth 自身に移したのは D-2026-11-22-4）。
# ruleset は本ファイルを commit SHA で固定して指定する。検出器・陰性対照・除外の一覧（skills-lock.json）は、
# この repo の、ruleset が固定した commit（github.workflow_sha）から取る。PR の head・マージ結果の tree からは取らない。
# 除外の一覧は、固定した commit の一覧が除外の上限を決める。走査対象（PR）の側の一覧は、検証（壊れていれば exit 2）と、
# その上限の中で除外を狭める（共通部分だけを除外する）ことにだけ使う。PR の一覧で除外を広げることはできない（scripts/hooks/secret-scan.sh）。
# 走査対象は actions/checkout で取らない（コミットの件名・ファイルのパスが公開ログへ出る。SECR-23）。
# 外部の action は使わない。取得は匿名で、トークンを渡さない（public の repo だけが対象。private の repo は取得に失敗して止まる）。
# 失敗は固定の文言で exit 2（検査不能）にする（fail-closed）。
#
# on.pull_request.branches を一致しにくい名前に絞っている理由:
#   組織の ruleset の必須 workflow は trigger に pull_request（または pull_request_target・merge_queue）（422 の応答の文言のまま）を要する
#   （API が 422 で拒否した）。ruleset から呼ぶ実行は branches の絞りに関係なく動く（試験で観察）。
#   この repo の普通の pull_request の workflow としては動かさないため、一致しにくい名前に絞る。
#   前提（いずれも未試験）: この名前の絞りだけでは、普通の pull_request の発火は止まらない。
#   このファイルが発火する経路は、少なくとも次がある（例）。
#     ・`trust-root-required-only-never-matches` は有効なブランチ名で、その名前のブランチを base にした PR を開く。
#     ・本ファイルの `on:` を書き換える PR（`branches` の削除・trigger の追加を含む。base は main）。pull_request は PR 側の版の workflow で評価されると読めるため。
#   この発火の実行は、同じ job 名 `trusted secret scan (tracked files)` で、PR の版の検出器を使うと読める。
#   それとは別に、同じ名前の check は、PR が足すほかの workflow の job からも出せる。
#   これらの実行が ruleset の必須の判定に数えられないか（同じ名前の check を数えないか）は未試験。同じ名前の check が PR 上に並ぶので、人が取り違えうる。
#   ruleset から呼ばれた実行と普通の発火の実行を、PR が書けない情報で見分けられるかは未確認（未試験）。
#   ログの中身は PR の版では PR の作者が書けるので、見分ける根拠にしない。
#   取得の step の `WORKFLOW_REF` の検査は repo とパスだけを照合するので、普通の発火の実行も通す。実行元を workflow の中で確かめても、PR が本ファイルを書き換えれば消せるので、守りにならない（守りは、ruleset が同じ名前の check を数えないこと。これは未試験で、(2)(d)(i) の試験で確かめる）。
#   ruleset の判定が、同じ名前の check を数えないかを〔実機〕で試験する必要がある（#5985 で追跡）。
#   `types` は指定しない（既定は opened・synchronize・reopened）。利用者の選択（2026-11-22）で、試験した版のままにした。
#   head の走査は head の tree 全体にかかる。ただし、次は走査から外れる。
#     ・登録済みの skill のディレクトリ（固定した版の一覧と head の一覧の共通部分。#6000）
#     ・submodule の中（検出器の範囲外。根拠は scripts/hooks/secret-scan.sh の冒頭の 59 行）
#   それ以外は、PR が足した中身は base に関係なく走査される。
#   組織の ruleset の対象は既定のブランチだけと読んでいるが、これは組織の owner が設定した時点の読みで、repo からは確かめられない。
#   base を切り替えても、その head で ruleset の実行が既にあるときに限り、マージ結果の走査が古くなるだけと読める（main が進んだときと同じ種類のこと。未試験の読み）。
#   別のブランチを base にして開いた PR を main に切り替えた場合、ruleset の実行が一度も無いことがありうる。
#   その場合、必須の検査が待ちになってマージが止まるのか（fail-closed）、無い扱いになって次の push まで検査なしでマージできるのか（fail-open）は未試験。
#   後者なら、検査なしでマージできる経路になりうる。
#   未試験: ruleset から呼ばれた実行で `types` が効くか（`branches` は効かないことを観察済み）。
#   未試験: 上の切り替えのときの必須の検査の扱い（待ち・無い扱いのどちらか）。
#   どちらも #5985 で追跡する。切り替えの前提としての扱いは、更新の手順の (2)(d) を参照する。
#
# 中身を変えても、組織の owner が ruleset の固定の SHA を上げるまで、実際に動くのは固定した commit の版である（試験で観察）。
# ruleset が active で bypass が空の間の〔実機〕の試験（scratch の repo。Evaluate にすると必須の workflow は動かない）で観察したのは次の 2 つ。
#   ・PR がこのファイルを書き換えて検出器を弱め、`.env` を足した場合: 固定の版が動き、検出 1 件で check が failure になり、マージが BLOCKED になった。
#   ・PR がこのファイルを削除し、`.env` を足した場合: 同じくマージが BLOCKED になった。
#   どちらも PR の版の実行は観察されなかった（PR ごとに実行は 1 件）。
# 試したのはここまでで、PR の版の同じ名前の check が並ぶ場合は試していない（未試験）。
#
# 更新の手順:
#   (1) 検出器・本ファイル・skills-lock.json の変更を、普通の PR でマージする。
#   (2) 組織の owner が、上げる先の commit について手元で次を確かめる。
#       次の (a)〜(c) の git・grep・script の実行は（(d) は試験の合格の確認で、この規則の対象ではない）、出力を一時ファイルに書き、終了コードを先に確かめる。
#       0 でなければ検査不能として止める（固定の SHA を上げない）。出力が空・0 件であることを「該当なし」と読むのは、終了コードが 0 のときだけ。
#       パイプにしない（パイプでは先頭の git の失敗が見えず、オブジェクトが読めなかったときも「0 件」になる）。
#       grep・`[ ]` は、各項に書いた終了コードで判定する（git と script は 0 でなければ止める）。
#       例外: (c) の hash の値はコマンド置換で取り、終了コードと 40 桁の形で判定する。
#       手順の最初に、環境変数で git の pathspec の解釈が変わっていないことを確かめる。次の 2 段で行う（パイプにしない）。
#       ・`env > <一時ファイル>` の終了コードが 0 であることを確かめる（0 でなければ止める）。
#       ・`grep -E '^GIT_[A-Z_]*PATHSPECS=' <一時ファイル>` の終了コードが 1（1 件も無い）であることを確かめる。0（該当がある）のときは止める。2（失敗）のときも止める。
#       `GIT_LITERAL_PATHSPECS`・`GIT_GLOB_PATHSPECS`・`GIT_NOGLOB_PATHSPECS`・`GIT_ICASE_PATHSPECS` のどれかがあれば（grep が 0）、unset するのではなく止めて原因を調べる。
#       理由: pathspec の解釈を変えうるので、一律に止める（`GIT_LITERAL_PATHSPECS` では magic が効かなくなり、陰性の検査が空のまま通る）。
#       オプションは `-E` だけを使う（grep の実装に依らないため）。
#       空の tree の SHA は固定の値 `4b825dc642cb6eb9a060e54bf8d69288fbee4904` を使う（この repo は SHA-1。以下 <空の tree> と書く）。
#       コマンドで取らない（取れなかった値が空のまま展開される経路を残さない）。`git hash-object -t tree /dev/null` の出力がこの値と一致することは、確かめに使ってよい。
#       (a) `git remote get-url origin` の終了コードが 0 で、出力がこの repo の URL と一致することを確かめた後、
#           `git fetch origin main` の終了コードが 0 であることを確かめ、`git rev-list --first-parent FETCH_HEAD > <一時ファイル>` を実行し、
#           その終了コードが 0 であることを確かめた後、`grep -qxF <sha> <一時ファイル>` が 0 で終わる（<sha> は 40 桁の小文字の完全な SHA。パイプの SIGPIPE を避けるため）
#           （main の first-parent の履歴の上の commit であり、PR の head などではない）。grep が 1（履歴の上に無い）・2（失敗）のときも止める。
#       (b) 最初に、<sha> と <今の固定の SHA> がそれぞれ 40 桁の小文字の 16 進数であることを確かめる。
#           `printf '%s\n' "<値>" > <一時ファイル>` の後、`grep -Ex '[0-9a-f]{40}' <一時ファイル>` の終了コードが 0 であること（0 でなければ止める。`-E`・`-x` は ugrep でも使える）。
#           以下の git の引数（sha・pathspec）はクォートして渡す。理由: 値が空のまま展開されると、引数が 1 つ減って作業ツリーとの比較になり、全部通ってしまうため。
#           本ファイルと 5 ファイル
#           （scripts/lib.sh・scripts/secret-scan-ci.sh・scripts/secret-scan-canary.sh・scripts/hooks/secret-scan.sh・skills-lock.json）の、
#           今の固定の commit からの差分を、mode を含めて確かめる（`git --no-pager diff --no-ext-diff --no-textconv -a --summary` と `git --no-pager diff --no-ext-diff --no-textconv -a`。出力は一時ファイルへ書き、終了コード 0 を先に確かめる）。
#           skills-lock.json で名前が増えると、その skill のディレクトリが走査から外れる（除外の拡大）。
#           増えた名前は 1 つずつ確かめる。skills の更新の PR は自動でマージされうるので、
#           main の first-parent の履歴の上にあることは人のレビュー済みを意味しない。
#           あわせて、`.gitattributes`（どのパスでも）を確かめる（コマンドは repo のルートで実行する。相対のパスで効かないようにするため）。
#           ・陽性対照（pathspec の照合が効いていること）。次の 2 つの検査の前に、陰性の検査と同じ形で、本ファイルを引く。
#             `git diff --name-only -z <空の tree> <sha> -- ':(top,glob,icase)**/TRUST-ROOT-SECRET-SCAN.YML' > <一時ファイル>` の終了コードが 0 であることを確かめた後、
#             `[ -s <一時ファイル> ]` で、出力が空でないことを確かめる。パターンの名前を大文字にするのは、`glob` と `icase` が効いていることを 1 回で示すため（`icase` が効かなければ空になる）。0 でなければ（読めていない・本ファイルが無い commit・magic が効いていない）止める。
#             `git cat-file -e` のように pathspec の照合を通らない手段では、陽性対照にしない（`GIT_LITERAL_PATHSPECS=1` のときも通ってしまうため）。
#           ・今の固定の commit から上げる先までに、追加・変更・削除が無いこと。
#             `git diff --name-only -z <今の固定の SHA> <sha> -- ':(top,glob,icase)**/.gitattributes' > <一時ファイル>` の終了コードが 0 であることを確かめた後、
#             `[ -f <一時ファイル> ] && [ ! -s <一時ファイル> ]` で、一時ファイルがあり出力が空であることを確かめる（空でなければ止める）。
#             陽性対照は上の項目のものを使う（同じ pathspec の形。<sha> が読めていること）。
#             これは両端の 2 つの commit の tree の差分を見るもので、今の固定の commit に `.gitattributes` が無いことが前提になる。
#             5 ファイルの blob と mode が同じでも、`.gitattributes` が展開した内容を変えうる（trusted/ は git checkout で作業ツリーに展開する）。
#           ・毎回、上げる先の commit に `.gitattributes` が無いこと。<空の tree> と <sha> について、
#             `git diff --name-only -z <空の tree> <sha> -- ':(top,glob,icase)**/.gitattributes' > <一時ファイル>` の終了コードが 0 であることを確かめた後、
#             `[ -f <一時ファイル> ] && [ ! -s <一時ファイル> ]` で空であることを確かめる（空でなければ止める）。パスの照合は git が行う。
#             パスを行に直して数える手順は使わない（改行を含むパスを `.gitattributes` と取り違えるため）。
#             陽性対照は上の項目のものを使う。
#             `-z` は、パスの引用符を避けるため。`icase` は、大文字小文字を区別しないファイルシステムで別名が読まれる場合に備える。
#             あれば、固定の SHA を上げずに止める。
#             `text`・`eol`・`crlf`・`working-tree-encoding`・`ident`・`filter`（`filter=lfs` を含む）の指定を 1 つずつ確かめるのは、
#             この方針を変えるかを人が判断する材料にするときだけ。
#       (c) (b) を終えてから行う（まだ確かめていない script を手元で動かさないため）。手元の環境で行い、runner での確認ではない。
#           上げる先の commit を、本ファイルの取得の step と同じ手順で、手元の空のディレクトリに展開する。
#           `git -c core.hooksPath=/dev/null init`・`git -c core.hooksPath=/dev/null fetch --quiet --no-tags --depth=1 <この repo の URL> <sha>`・
#           `git -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD` の順。各コマンドの終了コードが 0 でなければ止める。
#           対象は workflow と同じ用意で、別の空のディレクトリに、`git -c core.hooksPath=/dev/null init`・
#           `git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 <この repo の URL> main`・`git -c core.hooksPath=/dev/null update-ref HEAD FETCH_HEAD` の順で、
#           この repo の main の先端の commit のオブジェクトだけを取る。各コマンドの終了コードが 0 でなければ止める。
#           展開の直後に、script を流す前に、次の 3 点を、展開先で（`git -C <展開先> …`。`test -x` などのパスも展開先のもの）確かめる。どれかが満たされなければ止める。
#           ・`git rev-parse HEAD` の終了コードが 0 で、出力が <sha>（40 桁）と一致する。
#           ・展開した 6 ファイル（本ファイルと 5 ファイル）で、`a="$(git hash-object --no-filters <file>)"` と `b="$(git rev-parse <sha>:<path>)"` を
#             それぞれ終了コードが 0 であることを確かめて取り、a と b がともに 40 桁の小文字の 16 進数で、一致する（取れなかった値どうしの空の一致を通さないため）。
#             展開したファイルが blob と同じバイトであることを確かめるため。
#           ・6 ファイルの mode。`git ls-tree <sha> -- <path> > <一時ファイル>` の終了コードが 0 であることを確かめ、先頭の mode を読む（空なら止める）。
#             100644・100755 以外（120000・160000 など）は止める。展開したファイルが通常のファイル（`[ -f <file> ] && [ ! -L <file> ]`）であることも確かめ、
#             実行ビットは、tree の mode が 100755 なら `test -x <file>` が真、100644 なら `! test -x <file>` が真であること。
#           その後で、展開した `scripts/secret-scan-ci.sh` をその対象に流し、出力を一時ファイルへ書く。終了コードが 0 であることを先に確かめた後、
#           検出 0 件の行（`grep -qE '^secret-scan: total: 0 finding\(s\)'`）と、
#           陰性対照の行（`grep -qE '^scan-canary: scanner exited 1 on the planted dummies as expected'`）が、どちらも見つかる（0）ことを確かめる。行頭に固定する。
#           展開の後の検出器が起動できることを確かめるため。
#       初回（ci-trust-root からこの repo へ移したとき）は比べる先がこの repo に無いので、
#       本ファイルが試験した版から、drift の警告の step と、取得の step の workflow ref の echo の 1 行と、head の SHA が無いときの代わりの値（`|| github.sha`）を除いたものとコメント行以外で一致することと、
#       5 ファイルが ci-trust-root の、ruleset が固定していた commit（66103e4a14c93e03d6608228c922e18ae9b24c7b）の写しと、内容と mode（git の tree の種類と実行ビット）で一致することを `git ls-tree` で確かめる（終了コードが 0 であることを先に確かめる）。
#       あわせて、上げる先の commit に `.gitattributes` が無いことを、(b) の空の tree との `git diff --name-only -z` の手順と、同じ pathspec の形の陽性対照で確かめる
#       （終了コード 0 を先に確かめる。repo のルートで実行する。環境変数の検査も先に行う）。
#       今の repo には `.gitattributes` が無い（main の commit cfe974090bb75704ce48953a0421ee3d73518540 で、(b) の手順で確かめた。
#       本ファイルが無い commit なので、陽性対照は本ファイルの代わりに `git diff --name-only -z <空の tree> <sha> -- ':(top,glob,icase)**/SCRIPTS/LIB.SH'` が空でないことで確かめた。
#       この形への書き換えは後から行ったもので、cfe9740… についてはこの形で改めて流し、陽性対照が空でなく陰性が空であることを確かめた）。
#       (d) は毎回要る（初回は新たに合格させる）。
#       (d) 切り替えの前提。組織の ruleset の固定先を変える前に、次の 2 点の〔実機〕の試験に、人が合格と判定した記録があること。合格するまで (3) に進まない。
#           ・(i) PR 側に同じ名前の check（`trusted secret scan (tracked files)`）が success で並んでも、固定版が success 以外ならマージが止まること。
#             PR の版は、本ファイルの `on:` を書き換えたもの・別の workflow を足したもの・本ファイルを変えず `trust-root-required-only-never-matches` のブランチを base にした PR の 3 通りを試す
#             （最後の実行では `github.workflow_sha` が PR 側になるので、PR 側の検出器が同じ名前で動くと読める）。
#             3 通り目は、同じ名前の check が出た後に、base を main に切り替えて判定する（(ii) の V1 と重なる）。
#             理由: その base（`trust-root-required-only-never-matches`）は ruleset の対象の外で、そのままではマージの判定ができないため。
#           ・(ii) 別のブランチを base にして開いた PR を main に切り替えても、固定版の有効な結果が出るまでマージが止まること
#           場面の分け方・試験が成り立つ条件・判定の仕方（拒否の理由が必須の workflow であること・陽性対照）は試験の計画に書き、その計画と結果は spec に記録する（#5985 で追跡）。
#           (d) は毎回要る。やり直すのは、初回、本ファイルの `on:`・workflow や job の `name:`・job ID・`concurrency`・`timeout-minutes` を変えたとき、
#           組織の ruleset の設定（対象・bypass・enforcement）を変えたとき。それ以外は前回の合格の記録を確かめる。
#   (3) (2) のすべて（(a)〜(d)。初回は、初回の段落の代わりの確認を含む）を満たした後に、組織の owner が、ruleset の固定の SHA をその commit に変える。
#       変える前に、今の設定を控えておく（(4) で戻す先）。控えは、個別の ruleset の GET（一覧ではなく、対象の 1 件の取得）で取り、一時ファイルへ書く（API の出力をパイプで捨てない）。
#       取得のコマンドの終了コードが 0 で、`[ -s <一時ファイル> ]` でファイルが空でなく、`jq -e . < <一時ファイル>` が通ることを確かめる。
#       あわせて、`id` が対象の ruleset（`<対象の ruleset の id>`）と一致すること、`rules`・`conditions`・`enforcement`・`bypass_actors` を持つことを `jq -e` で確かめてから、変更に進む。
#       どれかが満たされなければ変更しない（戻す先が無いまま変えない）。
#   (4) 変更の後に組織の ruleset を読み返し、次を照合する。
#       どれかが合わなければ直ちに (3) の前に控えた設定に戻す。戻した後の基準は、読み返した設定が (3) の前に控えた設定と一致すること。
#       照合する項目は `name`・`target`・`enforcement`・`bypass_actors`・`conditions`・`rules`。`id`・`updated_at` などサーバーが持つ項目は比べない。
#       比べ方は、両方を `jq -S` で正規化してから比べる（項目の取り出しも同じ `jq` で行い、出力は一時ファイルへ書いて終了コード 0 を先に確かめる）。
#       （旧 SHA に戻せば固定の SHA は <sha> と一致しなくなるので、戻した後に下の項目を再び照合するのではない。初回は参照先の repo も違う）。
#       戻した後も控えと一致しないときは、組織の owner が以後の変更を止め、人（利用者）に上げる。
#       ・固定の SHA が (a)〜(c) で確かめた `<sha>` と一致する。
#       ・workflow の参照先（source の repo が fandhe-auth、path が `.github/workflows/trust-root-secret-scan.yml`）が合う。
#         参照先の `repository_id` も数の ID なので、下と同じく `gh api repositories/<id> --jq .full_name` で引き当てて照合する。
#       ・対象の条件が合う。repository の include に fandhe-auth が入り、exclude には入らない。ref の include に既定のブランチ main が入り、exclude には入らない。
#         include・exclude はパターン（`~ALL`・`~DEFAULT_BRANCH`・glob）でありうるので、名前の一致ではなく、パターンの一致の判定で照合する。
#         property による条件（repository_property など）がある場合も含めて見る。
#         API の結果の `repository_id` は数の ID なので、repo 名に引き当てる（例: `gh api repositories/<id> --jq .full_name`。
#         出力は一時ファイルへ書き、終了コード 0 を先に確かめる）。引き当てられない・名前が合わないときは合わないとして扱う。
#         照合は owner 付きの `Fandhe-AI/fandhe-auth` で行う（repo 名だけの一致では、別の owner の同名の repo を通しうるため）。
#       ・enforcement が active で、bypass が空である。
#
# 除外の一覧（skills-lock.json）も固定した commit から読む。skill を足した後、固定の SHA を上げるまでは、
# 足した skill の文書が走査され、検出があれば止まる（安全側）。
# 実行の部分は、試験した版（Fandhe-AI/ci-ruleset-test の commit 362d0624317055ba904e50a9fbbcb34351c21197 の同じパス。archive 済み）から drift の step とログの workflow ref の 1 行と、head の SHA が無いときの代わりの値（`|| github.sha`）を除いたもの（pull_request のイベントでは合否は同じ。`|| github.sha` を外した分、head の SHA が無いときに exit 2 になる経路は未試験）。
#
# 取得元と WORKFLOW_REF の検査は github.repository から決まるので、この workflow は他の repo と共用できない
# （他の repo の ruleset から参照すると exit 2 で止まる）。
name: trust-root-secret-scan
on:
  pull_request:
    branches:
      - trust-root-required-only-never-matches
permissions: {}
jobs:
  secret-scan:
    name: "trusted secret scan (tracked files)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      # 検出器の取得。ruleset が固定した commit（github.workflow_sha）だけをこの repo から取り、main の先端は使わない。
      - name: Fetch trusted detector (the pinned commit of this workflow)
        env:
          WORKSPACE: ${{ github.workspace }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          REPOSITORY: ${{ github.repository }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -uo pipefail
          fail() { echo "trusted-secret-scan: failed to prepare the trusted detector" >&2; exit 2; }
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail
          case "${WORKFLOW_REF}" in
            "${REPOSITORY}/.github/workflows/trust-root-secret-scan.yml@"*) ;;
            *) fail ;;
          esac
          echo "workflow sha: ${WORKFLOW_SHA}"
          trusted="${WORKSPACE}/trusted"
          git -c core.hooksPath=/dev/null init -q "${trusted}" > /dev/null 2>&1 || fail
          git -c core.hooksPath=/dev/null -C "${trusted}" fetch --quiet --no-tags --depth=1 \
            "${SERVER_URL}/${REPOSITORY}.git" "${WORKFLOW_SHA}" > /dev/null 2>&1 || fail
          git -c core.hooksPath=/dev/null -C "${trusted}" checkout -q --detach FETCH_HEAD > /dev/null 2>&1 || fail
          trusted_sha="$(git -c core.hooksPath=/dev/null -C "${trusted}" rev-parse HEAD 2> /dev/null)" || fail
          [[ "${trusted_sha}" == "${WORKFLOW_SHA}" ]] || fail
          echo "trusted detector: ${trusted_sha}"

      # 走査対象は 2 つ: PR の head と、マージ結果（pull_request では github.sha が refs/pull/N/merge の commit。
      # D-2026-11-21-18 の (4)(b)）。head の SHA が無いときは検査不能（exit 2）にする。
      # merge queue を使うときは、イベントの種類で分けて trigger と試験をやり直す。
      # どちらもオブジェクトだけを取り、HEAD を張る（作業ツリーは展開しない）。2 つが同じ commit なら 1 回だけ走査する。
      - name: Fetch scan target objects (PR head and merge result; no working tree)
        id: targets
        env:
          WORKSPACE: ${{ github.workspace }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -uo pipefail
          fail() { echo "trusted-secret-scan: failed to prepare the scan target" >&2; exit 2; }
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail
          [[ "${MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail
          prepare() {
            local dir="$1" sha="$2"
            git -c core.hooksPath=/dev/null init -q "${dir}" > /dev/null 2>&1 || fail
            git -c core.hooksPath=/dev/null -C "${dir}" fetch --quiet --no-tags --depth=1 \
              "${SERVER_URL}/${REPOSITORY}.git" "${sha}" > /dev/null 2>&1 || fail
            git -c core.hooksPath=/dev/null -C "${dir}" update-ref HEAD "${sha}" > /dev/null 2>&1 || fail
          }
          prepare "${WORKSPACE}/target" "${HEAD_SHA}"
          echo "scan target (head): ${HEAD_SHA}"
          if [ "${MERGE_SHA}" != "${HEAD_SHA}" ]; then
            prepare "${WORKSPACE}/target-merge" "${MERGE_SHA}"
            echo "scan target (merge result): ${MERGE_SHA}"
            echo "merge_scan=separate" >> "${GITHUB_OUTPUT}"
          else
            echo "scan target (merge result): same as head"
            echo "merge_scan=same" >> "${GITHUB_OUTPUT}"
          fi

      - name: Scan the PR head with the trusted detector
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "${WORKSPACE}/trusted/scripts/secret-scan-ci.sh" "${WORKSPACE}/target"

      # head の走査が失敗しても走らせる（両方の結果をログに残す）。job の合否は両方の失敗を受ける。
      - name: Scan the merge result with the trusted detector
        if: ${{ !cancelled() }}
        env:
          WORKSPACE: ${{ github.workspace }}
          MERGE_SCAN: ${{ steps.targets.outputs.merge_scan }}
        run: |
          set -u
          case "${MERGE_SCAN}" in
            separate) bash "${WORKSPACE}/trusted/scripts/secret-scan-ci.sh" "${WORKSPACE}/target-merge" ;;
            same) echo "merge result is the same commit as the head; scanned in the previous step" ;;
            *)
              echo "trusted-secret-scan: the scan target was not prepared" >&2
              exit 2
              ;;
          esac
