# ベース CI。
#
# ローカル（`make check`）・Git hooks（lefthook.yml）・CI が同じコマンド契約を共有する。
# CI 側で独自のチェックを定義せず、scripts/ の実体を呼ぶ（make スキルの「入口は複数でも
# 実処理の定義は一つ」）。Rust のビルドと試験は build-test ジョブ、整形と lint は lint ジョブで流す（TASK-6）。
# 秘密情報の検査は secret-scan ジョブで流す（TASK-6）。
# 言語固有のジョブを足すときは、必ず ci-complete の needs にも追加すること。
# ジョブ・発火条件の追加・変更時は .claude/rules/github-actions.md に従う。
#
# runner: public リポジトリのため GitHub ホステッド（ubuntu-latest）を使う。
name: CI

on:
  pull_request:
    # edited: PR タイトルの修正だけで pr-title ジョブを走らせ直す（既定の types に edited は無い）。
    # edited でも全ジョブを走らせる。一部を if: で skip すると required check が skipped=合格扱いになるため
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# PR では古い実行を取り消す。main への push は取り消さない（連続マージで前のコミットの
# CI 結果が失われないようにする）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 検査ツールの pin の正（単一宣言点）。SHA256 は GitHub リリース資産を実際にダウンロードして
# 実測し、リリース API の digest と一致することを確認した値（2026-10-07）。
# バンプ時は VERSION と SHA256 を必ず同時に更新する。ローカルの推奨版（README）も合わせる。
env:
  EDITORCONFIG_CHECKER_VERSION: "3.6.1"
  EDITORCONFIG_CHECKER_SHA256: "cd32084fce5f3d49ba49697f362ac3a114989715c98819303247dd54c1f368b0"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  check:
    name: "make check (editorconfig-checker + shellcheck)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（fandhe-frontend の ci.yml と同一 SHA に固定）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned lint tools
        # バージョン固定 + SHA256 検証済みのプリビルトバイナリを導入する。
        # ubuntu-latest にはプリインストールの shellcheck があるため、導入先を
        # GITHUB_PATH の先頭へ追加して pin 版を優先させる。
        # editorconfig-checker の配布物は bin/ec-linux-amd64 のため、scripts/check.sh が
        # 呼ぶコマンド名 editorconfig-checker へリネームして配置する。
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/lint-tools/bin"
          work_dir="${RUNNER_TEMP}/lint-tools/work"
          mkdir -p "${bin_dir}" "${work_dir}"
          cd "${work_dir}"

          ec_archive="ec-linux-amd64.tar.gz"
          curl -fsSLo "${ec_archive}" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EDITORCONFIG_CHECKER_VERSION}/${ec_archive}"
          echo "${EDITORCONFIG_CHECKER_SHA256}  ${ec_archive}" | sha256sum -c -
          tar -xzf "${ec_archive}" bin/ec-linux-amd64
          install -m 0755 bin/ec-linux-amd64 "${bin_dir}/editorconfig-checker"

          sc_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "${sc_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc_archive}"
          echo "${SHELLCHECK_SHA256}  ${sc_archive}" | sha256sum -c -
          tar -xJf "${sc_archive}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${bin_dir}/shellcheck"

          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Show tool versions
        # pin 版が PATH 上で優先されていることを確認する（不一致は失敗させる）
        run: |
          set -euo pipefail
          make --version | head -n1
          editorconfig-checker --version
          shellcheck --version
          # リリースバイナリは `v3.6.1` のように v 接頭辞付きで出力する（Homebrew 版は付かない）
          actual_ec="$(editorconfig-checker --version)"
          actual_ec="${actual_ec#v}"
          actual_sc="$(shellcheck --version | sed -n 's/^version: //p')"
          [ "${actual_ec}" = "${EDITORCONFIG_CHECKER_VERSION}" ] || { echo "::error::editorconfig-checker ${actual_ec} != ${EDITORCONFIG_CHECKER_VERSION}"; exit 1; }
          [ "${actual_sc}" = "${SHELLCHECK_VERSION}" ] || { echo "::error::shellcheck ${actual_sc} != ${SHELLCHECK_VERSION}"; exit 1; }

      - name: make check
        run: make check

  # フックスクリプト（scripts/hooks/*.sh）自体の回帰テスト（.claude/rules/git-hooks.md）。
  # テストはフックに置かず CI で実行する。外部依存は bash + git のみで、ツールの導入は不要。
  # 開発者の多くは macOS でフックを実行するため、BSD 系の挙動と macOS 標準の bash 3.2
  # （lefthook は PATH 上の bash で起動する）でも検証する。
  test-hooks:
    name: "hook script tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 実行した bash のバージョンはテスト出力の先頭行に表示される
      - name: make test-hooks
        run: make test-hooks

      - name: test-hooks with macOS system bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash scripts/hooks/test-hooks.sh

  # Rust の workspace のビルドと試験（TASK-6）。ローカルの `make build`・`make test` と同じ契約。
  # --locked で Cargo.lock の外を解決しない。--all-features は付けない（DPOL-31）。
  # toolchain は runner 既定の rustup の stable を使う（暫定。版・MSRV は TASK-4 で人が決め、
  # rust-toolchain.toml が入ったら追随する）。キャッシュは未導入（効果を測ってから入れる）。
  build-test:
    name: "make build + make test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust toolchain versions
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          cargo -V

      - name: make build
        run: make build

      - name: make test
        run: make test

  # Rust の整形の差分検査と lint（TASK-6）。ローカルの `make lint` と同じ契約で、rustfmt の差分・
  # clippy の警告（-D warnings）・crate 間の依存の向きの検査のどれかが非 0 なら失敗する。
  # --all-features は付けない（DPOL-31。crate 間の依存の列挙だけは check-crate-deps.sh の方針に従う）。
  # toolchain は runner 既定の rustup の stable（暫定。版・MSRV は TASK-4 で人が決める）。
  # キャッシュは未導入。build-test とは needs を張らず並列に流す。
  lint:
    name: "make lint (rustfmt + clippy + crate-deps)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Rust toolchain versions
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          cargo -V
          cargo fmt --version
          cargo clippy --version

      - name: make lint
        run: make lint

  # 秘密情報の混入検査（TASK-6）。PR のマージ結果の追跡ファイルを走査し、1 件以上で失敗する（SECR-23）。
  # 走査しない範囲は検出器の定義（scripts/hooks/secret-scan.sh の除外）に固定された次の 3 つだけで、
  # CI 側で足し引きしない: .agents/skills/**・.claude/skills/**（skills-lock.json 管理の外部取得物）・*.lock（ハッシュ列）。
  # 続けて陰性対照（scan-canary）で、実行時に組み立てた既知のダミーだけの一時 index に検出器が 1 を返すことを
  # 確かめる（検出器が常に合格する状態を見逃さない。リポジトリの内容に依存しない）。ダミーは commit しない。
  # 実処理は scripts/secret-scan-ci.sh に置く（ローカルからも呼べる。出力の絞り込み・終了コードの伝播もそこ）。
  # 判定コードは信頼済みリビジョン（PR の base）から取り、PR のマージ結果は走査対象のデータとしてだけ渡す
  # （PR 自身が検出器・カナリアを書き換えて合格させる経路を作らない）。base にまだ CI 入口・陰性対照が無いとき（導入 PR 自身）
  # に限り PR 側の版を使う。導入後は base に必ず在るため、PR が削除・改変しても base の版が判定する。
  # 走査対象は作業ツリーへ展開せず object と index だけにし、checkout の診断に PR 由来のパスを出さない（SECR-23）。
  # 入口 2 点の片方だけ・入口のみで検出器本体が無い状態は fail-closed で失敗させる（検出器の削除を合格にしない）。
  # 限界: pull_request で動く本ファイル自体は PR の変更を含む。ワークフロー自体の改変の防止は
  # ruleset（必須ワークフロー・CODEOWNERS による本ファイルの保護）で行う。リポジトリ設定は人が決める。
  # 公開ログには規則 ID・件数だけを出し、検出ファイルのパスは出さない（--summary。パスに値が含まれ得る）。
  # 範囲外: コミット履歴・submodule の中。検出時は .claude/rules/security.md の重大度「高」に従う。
  secret-scan:
    name: "make secret-scan + make scan-canary"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 走査対象は作業ツリーへ展開せず、object と index だけを作る（checkout の診断に PR 由来のパスが出ない。SECR-23）。
      # 検出器は index と空 tree の差分で読むため、作業ツリーは要らない。失敗時は固定文だけを出す。
      - name: Fetch PR merge result into an index (scan target; no working tree)
        run: |
          set -euo pipefail
          git init -q target
          if ! git -C target fetch -q --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}" "${GITHUB_SHA}" 2>/dev/null \
            || ! git -C target read-tree FETCH_HEAD 2>/dev/null; then
            echo "::error::failed to load the scan target (details withheld)"
            exit 2
          fi

      - name: Checkout (trusted base; detector)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted
          persist-credentials: false

      - name: secret-scan (scan the PR merge result with the trusted detector)
        run: |
          set -euo pipefail
          # 判定コードは base の版。base に検出器の入口（CI 入口・陰性対照）がまだ無い導入 PR に限り、
          # PR 側の版を使う（検出器本体 secret-scan.sh は base に在っても旧版で --summary を持たないため PR 側を使う）。
          # 入口 2 点のうち片方だけ在る・入口は在るのに検出器本体が無い状態は fail-closed。
          entry=0
          for f in scripts/secret-scan-ci.sh scripts/secret-scan-canary.sh; do
            if [ -f "trusted/${f}" ]; then entry=$((entry + 1)); fi
          done
          if [ "${entry}" -eq 2 ] && [ -f trusted/scripts/hooks/secret-scan.sh ]; then
            trusted/scripts/secret-scan-ci.sh "${GITHUB_WORKSPACE}/target"
          elif [ "${entry}" -eq 0 ]; then
            echo "::warning::trusted base has no secret-scan entry points; using the PR version (bootstrap only)"
            # PR 側の版は作業ツリーへ展開しない: 必要な 3 点だけを object から取り出す
            boot="${RUNNER_TEMP}/boot"
            mkdir -p "${boot}/scripts/hooks"
            git init -q "${boot}"
            for f in scripts/lib.sh scripts/secret-scan-ci.sh scripts/secret-scan-canary.sh scripts/hooks/secret-scan.sh; do
              git -C target cat-file blob "FETCH_HEAD:${f}" > "${boot}/${f}" 2>/dev/null || { echo "::error::PR lacks the detector files; failing closed"; exit 1; }
              chmod +x "${boot}/${f}"
            done
            "${boot}/scripts/secret-scan-ci.sh" "${GITHUB_WORKSPACE}/target"
          else
            echo "::error::trusted base has an incomplete secret detector set; failing closed"
            exit 1
          fi

  # squash merge では PR タイトルがそのままコミット件名になるため、commit-msg フックと
  # 同じスクリプトで Conventional Commits 形式を検証する（フックの CI 側の対）。
  # PR タイトルは任意文字列のため、${{ }} を run へ直接展開せず env 経由でファイルへ書き出す
  # （シェルインジェクション防止）。push イベントでは skipped になる（ci-complete で明示許容）。
  pr-title:
    name: "PR title (Conventional Commits)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          msg_file="${RUNNER_TEMP}/pr-title.txt"
          printf '%s\n' "${PR_TITLE}" > "${msg_file}"
          bash scripts/hooks/commit-msg-check.sh "${msg_file}"

  # 必須チェックの集約ジョブ。ruleset の required status checks には本ジョブのみを登録する。
  # ジョブを追加したら必ず needs へも追加すること（漏れると未検査のままマージ可能になる）。
  # fail-closed: success 以外は失敗とし、skipped は条件付きジョブ（pr-title）が
  # 本来 skip されるべき状況（pull_request 以外のイベント）でのみ明示的に許容する。
  ci-complete:
    name: ci-complete
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - check
      - test-hooks
      - build-test
      - lint
      - secret-scan
      - pr-title
    steps:
      - name: 全ジョブ結果の検証
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "${RESULTS}" | jq -e --arg ev "${EVENT_NAME}" 'to_entries | map(select((.value.result == "success" or (.key == "pr-title" and .value.result == "skipped" and $ev != "pull_request")) | not)) | length == 0' > /dev/null
