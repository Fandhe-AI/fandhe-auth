# ベース CI。
#
# ローカル（`make check`）・Git hooks（lefthook.yml）・CI が同じコマンド契約を共有する。
# CI 側で独自のチェックを定義せず、scripts/ の実体を呼ぶ（make スキルの「入口は複数でも
# 実処理の定義は一つ」）。Rust のビルドと試験は build-test ジョブ、整形と lint は lint ジョブ、秘密情報の検査は secret-scan ジョブ、DB の結合試験の枠は it-db-ci ジョブで流す（TASK-6）。
# 依存の検査（cargo-deny・cargo-audit）の枠は deps-audit ジョブで、道具の導入だけを置く（TASK-6 6/10。検査は未結線）。
# 言語固有のジョブを足すときは、必ず ci-complete の needs にも追加すること。
# ジョブ・発火条件の追加・変更時は .claude/rules/github-actions.md に従う。
#
# runner: public リポジトリのため GitHub ホステッド（ubuntu-latest）を使う。
name: CI

on:
  pull_request:
    # edited: PR タイトルの修正だけで pr-title ジョブを走らせ直す（既定の types に edited は無い）。
    # edited でも全ジョブを走らせる。一部を if: で skip すると required check が skipped=合格扱いになるため
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# PR では古い実行を取り消す。main への push は取り消さない（連続マージで前のコミットの
# CI 結果が失われないようにする）
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# 検査ツールの pin の正（単一宣言点）。SHA256 は GitHub リリース資産を実際にダウンロードして
# 実測し、リリース API の digest と一致することを確認した値（2026-10-07）。
# バンプ時は VERSION と SHA256 を必ず同時に更新する。ローカルの推奨版（README）も合わせる。
env:
  EDITORCONFIG_CHECKER_VERSION: "3.6.1"
  EDITORCONFIG_CHECKER_SHA256: "cd32084fce5f3d49ba49697f362ac3a114989715c98819303247dd54c1f368b0"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  # 依存の検査の道具（deps-audit ジョブ）。版は暫定で、人が確定する。SHA256 は 2026-11-20 に資産を実測し、
  # リリース API の digest と一致することを確認した値（x86_64-unknown-linux-musl の資産）。
  CARGO_DENY_VERSION: "0.19.8"
  CARGO_DENY_SHA256: "70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f"
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"

jobs:
  check:
    name: "make check (editorconfig-checker + shellcheck)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1（fandhe-frontend の ci.yml と同一 SHA に固定）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned lint tools
        # バージョン固定 + SHA256 検証済みのプリビルトバイナリを導入する。
        # ubuntu-latest にはプリインストールの shellcheck があるため、導入先を
        # GITHUB_PATH の先頭へ追加して pin 版を優先させる。
        # editorconfig-checker の配布物は bin/ec-linux-amd64 のため、scripts/check.sh が
        # 呼ぶコマンド名 editorconfig-checker へリネームして配置する。
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/lint-tools/bin"
          work_dir="${RUNNER_TEMP}/lint-tools/work"
          mkdir -p "${bin_dir}" "${work_dir}"
          cd "${work_dir}"

          ec_archive="ec-linux-amd64.tar.gz"
          curl -fsSLo "${ec_archive}" \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EDITORCONFIG_CHECKER_VERSION}/${ec_archive}"
          echo "${EDITORCONFIG_CHECKER_SHA256}  ${ec_archive}" | sha256sum -c -
          tar -xzf "${ec_archive}" bin/ec-linux-amd64
          install -m 0755 bin/ec-linux-amd64 "${bin_dir}/editorconfig-checker"

          sc_archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "${sc_archive}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${sc_archive}"
          echo "${SHELLCHECK_SHA256}  ${sc_archive}" | sha256sum -c -
          tar -xJf "${sc_archive}" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${bin_dir}/shellcheck"

          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Show tool versions
        # pin 版が PATH 上で優先されていることを確認する（不一致は失敗させる）
        run: |
          set -euo pipefail
          make --version | head -n1
          editorconfig-checker --version
          shellcheck --version
          # リリースバイナリは `v3.6.1` のように v 接頭辞付きで出力する（Homebrew 版は付かない）
          actual_ec="$(editorconfig-checker --version)"
          actual_ec="${actual_ec#v}"
          actual_sc="$(shellcheck --version | sed -n 's/^version: //p')"
          [ "${actual_ec}" = "${EDITORCONFIG_CHECKER_VERSION}" ] || { echo "::error::editorconfig-checker ${actual_ec} != ${EDITORCONFIG_CHECKER_VERSION}"; exit 1; }
          [ "${actual_sc}" = "${SHELLCHECK_VERSION}" ] || { echo "::error::shellcheck ${actual_sc} != ${SHELLCHECK_VERSION}"; exit 1; }

      - name: make check
        run: make check

  # フックスクリプト（scripts/hooks/*.sh）自体の回帰テスト（.claude/rules/git-hooks.md）。
  # テストはフックに置かず CI で実行する。基本は bash + git。msrv・install-msrv の試験は
  # cargo・jq・tomllib を持つ python3（3.11 以上）を要し、ランナー導入済みのものを使う（このジョブでは導入しない）。
  # secret-scan の /dev/tcp 風のパスの試験（part 8）も python3 を要する。
  # CI では前提が足りなければ試験が失敗する（ローカルでは skip）。
  # 開発者の多くは macOS でフックを実行するため、BSD 系の挙動と macOS 標準の bash 3.2
  # （lefthook は PATH 上の bash で起動する）でも検証する。
  test-hooks:
    name: "hook script tests (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS は通る実行でも 10 分近くかかることがあり、runner の混雑で 10 分を超えて取り消された実行がある（TASK-6）。
    # macOS だけ 15 分にし、ubuntu は 10 分のままにする。
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 15 || 10 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 実行した bash のバージョンはテスト出力の先頭行に表示される
      - name: make test-hooks
        run: make test-hooks

      - name: test-hooks with macOS system bash 3.2
        if: runner.os == 'macOS'
        run: /bin/bash scripts/hooks/test-hooks.sh

  # Rust の workspace のビルドと試験（TASK-6）。ローカルの `make build`・`make test` と同じ契約。
  # --locked で Cargo.lock の外を解決しない。--all-features は付けない（DPOL-31）。
  # toolchain は MSRV の版（Cargo.toml の rust-version）を rustup で入れて使う。MSRV の値は D-2026-11-20-12、
  # CI を MSRV で流すのは利用者の指示（2026-11-20）。新しい stable での検査はしていない（足すかは未定）。
  # rust-toolchain.toml の有無は未定（決める TASK は spec に無い）。キャッシュは未導入（効果を測ってから入れる）。
  build-test:
    name: "make build + make test"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        # MSRV（Cargo.toml の rust-version。値は D-2026-11-20-12）の版を入れて既定にする。CI を MSRV で流すのは
        # 利用者の指示（2026-11-20）で、新しい stable での検査はしていない（足すかは未定）。処理は scripts/ に置く。
        run: scripts/install-msrv.sh

      - name: Show Rust toolchain versions
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          cargo -V

      - name: make build
        run: make build

      - name: make test
        run: make test

  # Rust の整形の差分検査と lint（TASK-6）。ローカルの `make lint` と同じ契約で、rustfmt の差分・
  # clippy の警告（-D warnings）・crate 間の依存の向きの検査・vendored の検査（DPOL-13）のどれかが非 0 なら失敗する。
  # --all-features は付けない（DPOL-31）。依存の列挙（check-crate-deps.sh）と vendored の参考走査（check-openssl-vendored.sh の走査 B）にだけ使い、
  # ビルド・clippy・合否判定では使わない。
  # toolchain は MSRV の版（Cargo.toml の rust-version）を rustup で入れて使う。MSRV の値は D-2026-11-20-12、
  # CI を MSRV で流すのは利用者の指示（2026-11-20）。新しい stable での検査はしていない（足すかは未定）。
  # キャッシュは未導入。build-test とは needs を張らず並列に流す。
  lint:
    name: "make lint (rustfmt + clippy + crate-deps)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        # MSRV（Cargo.toml の rust-version。値は D-2026-11-20-12）の版を入れて既定にする。CI を MSRV で流すのは
        # 利用者の指示（2026-11-20）で、新しい stable での検査はしていない（足すかは未定）。処理は scripts/ に置く。
        run: scripts/install-msrv.sh rustfmt clippy

      - name: Show Rust toolchain versions
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          cargo -V
          cargo fmt --version
          cargo clippy --version

      - name: make lint
        run: make lint

  # 追跡ファイル全体の秘密情報の混入検査（TASK-6 4/10。#51）。処理は scripts/secret-scan-ci.sh に置き、ここは呼ぶだけ。
  # 検出器（scripts/secret-scan-ci.sh・scripts/hooks/secret-scan.sh・陰性対照）は、PR では保護された main の先端
  # （refs/heads/main。PR の base ブランチではない。stacked PR でも未承認のブランチの版を使わない）を trusted/ へ
  # 取得した版だけを使い、PR の head（target/。作業ツリーを展開せずオブジェクトだけを取る）は走査対象のデータとして
  # 渡す。PR 側の検出器は呼ばない（検出器の書き換えで検査を迂回させない）。push（main）では github.sha を両方に取得する。
  # trusted/・target/ とも actions/checkout は使わない（コミット件名・ファイルのパスが公開ログへ出る。SECR-23）。
  # 取得したコミットの sha だけを固定の書式でログに出す。
  # 公開ログへ出るのは規則 ID・件数の集計行と固定の診断文だけで、パス・値は出さない（--summary の契約。SECR-23）。
  # 既知の限界: pull_request の workflow 定義（本ファイル）自体は PR が書き換えられる（#5985 で追跡。人の担当）。
  # 他のジョブと同じく if: で skip させない（edited でも走らせる。上の on: のコメント）。
  secret-scan:
    name: "secret scan (tracked files)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 取得は匿名で、GITHUB_TOKEN を使わない（トークンを渡さない）ため、権限は付けない。
    permissions: {}
    steps:
      # 検出器（trusted/）の取得。PR では main の先端（refs/heads/main）、push では github.sha。検出器を実行するため
      # 作業ツリーは展開するが、git の出力はすべて捨てる（checkout の `HEAD is now at <件名>` を出さない）。
      # 取得処理は scripts/ に置かず workflow に直接書く（取得の前には trusted/ 自体が無いため）。
      # 値は env 経由で渡し、ref は `refs/heads/main` か 40 桁の小文字 16 進数 sha だけを通す。トークンは渡さない。
      - name: Fetch trusted detector (main tip for PRs / pushed commit)
        env:
          WORKSPACE: ${{ github.workspace }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_REF: ${{ github.event_name == 'pull_request' && 'refs/heads/main' || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -uo pipefail
          fail() { echo "secret-scan: failed to prepare the trusted detector" >&2; exit 2; }
          [[ "${TRUSTED_REF}" == "refs/heads/main" || "${TRUSTED_REF}" =~ ^[0-9a-f]{40}$ ]] || fail
          trusted="${WORKSPACE}/trusted"
          git -c core.hooksPath=/dev/null init -q "${trusted}" > /dev/null 2>&1 || fail
          git -c core.hooksPath=/dev/null -C "${trusted}" fetch --quiet --no-tags --depth=1 \
            "${SERVER_URL}/${REPOSITORY}.git" "${TRUSTED_REF}" > /dev/null 2>&1 || fail
          git -c core.hooksPath=/dev/null -C "${trusted}" checkout -q --detach FETCH_HEAD > /dev/null 2>&1 || fail
          trusted_sha="$(git -c core.hooksPath=/dev/null -C "${trusted}" rev-parse HEAD 2> /dev/null)" || fail
          [[ "${trusted_sha}" =~ ^[0-9a-f]{40}$ ]] || fail
          echo "trusted detector: ${trusted_sha}"

      # 走査対象（PR の head・push のコミット）は actions/checkout で取らない。checkout は取得したコミットの
      # 件名（HEAD is now at ...）や展開するファイルのパスを公開ログへ出し、PR 由来の未加工の文字列が出る（SECR-23）。
      # 作業ツリーを展開せず、オブジェクトだけを取って HEAD を張る（検出器は HEAD の tree から一時 index を作る）。
      # この処理は scripts/ に置かない（PR の CI では trusted/ が main の先端の版で、新しいスクリプトが無いため）。
      # 値は env 経由で渡し、sha は 40 桁の小文字 16 進数だけを通す。トークンは渡さない（public の repo）。
      # git の出力はすべて捨て、失敗は固定の文言で exit 2（検査不能）にする。
      - name: Fetch scan target objects (PR head / pushed commit; no working tree)
        env:
          WORKSPACE: ${{ github.workspace }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -uo pipefail
          fail() { echo "secret-scan: failed to prepare the scan target" >&2; exit 2; }
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || fail
          target="${WORKSPACE}/target"
          git -c core.hooksPath=/dev/null init -q "${target}" > /dev/null 2>&1 || fail
          git -c core.hooksPath=/dev/null -C "${target}" fetch --quiet --no-tags --depth=1 \
            "${SERVER_URL}/${REPOSITORY}.git" "${HEAD_SHA}" > /dev/null 2>&1 || fail
          git -c core.hooksPath=/dev/null -C "${target}" update-ref HEAD "${HEAD_SHA}" > /dev/null 2>&1 || fail

      - name: Scan tracked files with the trusted detector
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "${WORKSPACE}/trusted/scripts/secret-scan-ci.sh" "${WORKSPACE}/target"

  # DB を使う結合試験の枠（TASK-6 5/10。#52）。ローカルの `make it-db-ci` と同じ契約。
  # DB は試験プロセスの中で crates/it-harness の Database が起動・停止する（パスワードは試験プロセスの中で
  # 生成し、ステップ間・GITHUB_ENV・ファイルに渡さない。SECR-6）。services: は使わない（TLS の初期化
  # スクリプトをマウントできず AUDP-9 の構成を再現できないため）。流すのは枠の試験だけで、他の #[ignore] は手で流す。
  # 展開した値を出す docker compose config・docker inspect は呼ばない。キャッシュは未導入（#55）。
  # toolchain は MSRV の版（build-test・lint と同じ。scripts/install-msrv.sh）。
  it-db-ci:
    name: "make it-db-ci (DB integration frame)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        # MSRV（Cargo.toml の rust-version。値は D-2026-11-20-12）の版を入れて既定にする。CI を MSRV で流すのは
        # 利用者の指示（2026-11-20）で、新しい stable での検査はしていない（足すかは未定）。処理は scripts/ に置く。
        run: scripts/install-msrv.sh

      - name: Show toolchain versions
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustc -vV
          cargo -V
          docker version --format '{{.Server.Version}}'
          docker compose version
          openssl version

      - name: make it-db-ci
        run: make it-db-ci

  # 依存の検査の枠（TASK-6 6/10。#53）。cargo-deny・cargo-audit を版固定 + SHA256 検証で導入するだけで、検査は流さない。
  # 緑でも DPOL-34（4 検査 + cargo-audit の合格）を満たしたことにならない。名前の「frame」は結線時に外す。
  # 結線は TASK-680（前提: deny.toml の厳格版 TASK-668・監査の実行スクリプトと advisory DB の記録 TASK-679）。
  # 定期の実行は TASK-681（#54）。結線の契約は .claude/rules/github-actions.md の「依存の検査の拡張点」。
  # ジョブ ID は変えず、ci-complete の needs から外さない。if: による skip・continue-on-error は付けない（DPOL-34）。
  # リポジトリを読まないので checkout は置かない（TASK-680 が要るときに persist-credentials: false で足す）。
  deps-audit:
    name: "deps audit frame (tool install only; checks wired in TASK-680)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Install pinned dependency audit tools
        # 版固定 + SHA256 検証済みのプリビルトバイナリを導入する。URL は env の固定値だけから組み立てる。
        run: |
          set -euo pipefail
          bin_dir="${RUNNER_TEMP}/deps-tools/bin"
          work_dir="${RUNNER_TEMP}/deps-tools/work"
          mkdir -p "${bin_dir}" "${work_dir}"
          cd "${work_dir}"

          deny_dir="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          deny_archive="${deny_dir}.tar.gz"
          curl -fsSLo "${deny_archive}" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${deny_archive}"
          echo "${CARGO_DENY_SHA256}  ${deny_archive}" | sha256sum -c -
          tar -xzf "${deny_archive}" "${deny_dir}/cargo-deny"
          install -m 0755 "${deny_dir}/cargo-deny" "${bin_dir}/cargo-deny"

          audit_dir="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          audit_archive="${audit_dir}.tgz"
          curl -fsSLo "${audit_archive}" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${audit_archive}"
          echo "${CARGO_AUDIT_SHA256}  ${audit_archive}" | sha256sum -c -
          tar -xzf "${audit_archive}" "${audit_dir}/cargo-audit"
          install -m 0755 "${audit_dir}/cargo-audit" "${bin_dir}/cargo-audit"

          echo "${bin_dir}" >> "${GITHUB_PATH}"

      - name: Show tool versions
        # 導入した版が env の宣言と一致することを確認する（不一致は失敗させる）
        run: |
          set -euo pipefail
          actual_deny="$(cargo-deny --version)"
          actual_audit="$(cargo-audit audit --version)"
          [ "${actual_deny}" = "cargo-deny ${CARGO_DENY_VERSION}" ] || { echo "::error::${actual_deny} != cargo-deny ${CARGO_DENY_VERSION}"; exit 1; }
          [ "${actual_audit}" = "cargo-audit-audit ${CARGO_AUDIT_VERSION}" ] || { echo "::error::${actual_audit} != cargo-audit-audit ${CARGO_AUDIT_VERSION}"; exit 1; }
          echo "${actual_deny}"
          echo "${actual_audit}"

      # TODO(TASK-680): TASK-679 の入口（scripts/ と make ターゲット）を呼ぶ 4 検査 + cargo-audit をここへ結線する。

  # squash merge では PR タイトルがそのままコミット件名になるため、commit-msg フックと
  # 同じスクリプトで Conventional Commits 形式を検証する（フックの CI 側の対）。
  # PR タイトルは任意文字列のため、${{ }} を run へ直接展開せず env 経由でファイルへ書き出す
  # （シェルインジェクション防止）。push イベントでは skipped になる（ci-complete で明示許容）。
  pr-title:
    name: "PR title (Conventional Commits)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          msg_file="${RUNNER_TEMP}/pr-title.txt"
          printf '%s\n' "${PR_TITLE}" > "${msg_file}"
          bash scripts/hooks/commit-msg-check.sh "${msg_file}"

  # 必須チェックの集約ジョブ。ruleset の required status checks には本ジョブのみを登録する。
  # ジョブを追加したら必ず needs へも追加すること（漏れると未検査のままマージ可能になる）。
  # fail-closed: success 以外は失敗とし、skipped は条件付きジョブ（pr-title）が
  # 本来 skip されるべき状況（pull_request 以外のイベント）でのみ明示的に許容する。
  ci-complete:
    name: ci-complete
    if: always()
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - check
      - test-hooks
      - build-test
      - lint
      - it-db-ci
      - secret-scan
      - deps-audit
      - pr-title
    steps:
      - name: 全ジョブ結果の検証
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "${RESULTS}" | jq -e --arg ev "${EVENT_NAME}" 'to_entries | map(select((.value.result == "success" or (.key == "pr-title" and .value.result == "skipped" and $ev != "pull_request")) | not)) | length == 0' > /dev/null
