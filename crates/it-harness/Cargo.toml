[package]
name = "fandhe-auth-it-harness"
description = "結合試験のハーネスの枠（試験専用。実物ではない）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# workspace 内の依存は secret（DB のパスワードを秘密値の型で持つ。SECR-30。TASK-10 (2/6)）・hub-stub
# （TASK-10 (3/6)）・console-stub（TASK-10 (4/6)）。いずれも試験専用どうしの辺。外部の crate は直接は足さない。
# minimal-host への辺は後続の段で足し、足すときに scripts/check-crate-deps.sh の許可表を人に確かめる。
# hub-stub・console-stub の辺の行は人の確認待ち。
[dependencies]
fandhe-auth-secret = { path = "../secret" }
fandhe-auth-hub-stub = { path = "../hub-stub" }
fandhe-auth-console-stub = { path = "../console-stub" }

# 試験専用の依存（TASK-13 5/8）。hub-stub の受け口が受理する署名済みトークンを、実行時に生成した鍵で作る。
# 版は hub-stub と同じ。人の確認待ち。
[dev-dependencies]
base64 = "0.22.1"
ring = "0.17.14"
serde_json = "1"
