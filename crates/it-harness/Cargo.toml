[package]
name = "fandhe-auth-it-harness"
description = "結合試験のハーネスの枠（試験専用。実物ではない）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# workspace 内の依存は secret（DB のパスワードを秘密値の型で持つ。SECR-30。TASK-10 (2/6)）と hub-stub
# （TASK-10 (3/6)。試験専用どうしの辺）。外部の crate は直接は足さない。console-stub・minimal-host への辺は
# 後続の段で足し、足すときに scripts/check-crate-deps.sh の許可表を人に確かめる。hub-stub の辺の行も人の確認待ち。
[dependencies]
fandhe-auth-secret = { path = "../secret" }
fandhe-auth-hub-stub = { path = "../hub-stub" }
