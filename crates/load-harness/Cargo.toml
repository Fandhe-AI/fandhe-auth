[package]
name = "fandhe-auth-load-harness"
description = "計測・負荷のハーネスの部品と記録の出力（試験専用。測定値は要件の値でも合否の判定でもない）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# 試験専用・仮称（人が確定する）。どの crate からも依存しない。通常の依存は 0（std だけ）。
[dependencies]

# 試験（dev）だけ it-harness の上で構成要素へ負荷をかける（TASK-12 5/10）。hub-stub は試験が設定・鍵の型を直接使うため。
# 試験で作る署名鍵の秘密値を照合の登録簿に入れるため、ring を試験（dev）だけに置く（#6050・SECR-23・AAUD-30）。
# 版は hub-stub・it-harness と同じ。本番の依存の木には入らない。許可表の行は人の確認待ち。
[dev-dependencies]
fandhe-auth-it-harness = { path = "../it-harness" }
fandhe-auth-hub-stub = { path = "../hub-stub" }
fandhe-auth-secret = { path = "../secret" }
ring = "0.17.14"
